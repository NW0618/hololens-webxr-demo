<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoloLens MR体験</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      text-align: center;
      background: #f7f7f7;
      color: #222;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 34px;
    }

    button {
      font-size: 28px;
      padding: 18px 32px;
      border: 0;
      border-radius: 10px;

    }

    button:disabled {
      background: #9ca3af;
      cursor: default;
    }

    #status {
      min-height: 32px;
      margin-top: 20px;
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>

  <main>
    <h1>HoloLens MR体験</h1>

    <button id="xrButton" disabled>
      WebXR確認中...
    </button>

    <div id="status"></div>
  </main>

  <!-- ルートの本番アプリは v40 -->
  <script src="app.js?v=41"></script>

</html>
